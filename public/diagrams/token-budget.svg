  <desc
     id="token-budget-desc">Today Rep 1 and Rep 2 each reserve 15,000 tokens and fill the 30,000-token minute; Rep 3 does not fit and gets a 429. With the retry queue Rep 3 waits about 30 seconds, then answers. With 4,000-token prompts three requests use 13,500 of 30,000, room for six.</desc>
