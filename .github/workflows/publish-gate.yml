name: Publish gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks and 30-question eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Eval against the built app
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -fs http://localhost:3203/api/ask?q=ping >/dev/null && break; sleep 1; done
          pnpm eval --url http://localhost:3203 --threshold 24 --baseline eval/baseline.json

  publish:
    name: Publish
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only after the gate passed
        run: npx vercel@53 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
